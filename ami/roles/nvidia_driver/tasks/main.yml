---
# yamllint disable rule:line-length
- name: Require a known kernel module flavour
  ansible.builtin.assert:
    that:
      - nvidia_driver_kernel_modules in ["proprietary", "open"]
    fail_msg: >-
      nvidia_driver_kernel_modules must be "proprietary" or "open",
      got "{{ nvidia_driver_kernel_modules }}"

- name: Enable AL2023 NVIDIA repository
  ansible.builtin.dnf:
    name: nvidia-release
    state: present

- name: Install NVIDIA data-center driver with the proprietary kernel modules
  ansible.builtin.dnf:
    name: "nvidia-driver-cuda-{{ nvidia_driver_package_version }}"
    state: present
  when: nvidia_driver_kernel_modules == "proprietary"

# nvidia-open pulls kmod-nvidia-open-dkms and the matching user-space libraries. The two flavours
# provide the same kernel module name, so a host installs one or the other, never both.
- name: Install NVIDIA data-center driver with the open kernel modules
  ansible.builtin.dnf:
    name: "nvidia-open-{{ nvidia_driver_package_version }}"
    state: present
  when: nvidia_driver_kernel_modules == "open"

# A driver alone does not make a container see a GPU: the device plugin fails with
# "Failed to initialize NVML: ERROR_LIBRARY_NOT_FOUND" until the container toolkit injects the
# driver libraries. The toolkit lives in NVIDIA's libnvidia-container repository, not in the CUDA
# one that nvidia-release configures.
- name: Add NVIDIA container toolkit repository
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo
    dest: /etc/yum.repos.d/nvidia-container-toolkit.repo
    mode: "0644"

- name: Import the NVIDIA container toolkit signing key
  ansible.builtin.rpm_key:
    key: https://nvidia.github.io/libnvidia-container/gpgkey
    state: present

- name: Install NVIDIA container toolkit
  ansible.builtin.dnf:
    name: "nvidia-container-toolkit-{{ nvidia_container_toolkit_version }}"
    state: present

- name: Reboot after NVIDIA driver installation
  ansible.builtin.reboot:
  when: nvidia_driver_allow_reboot

- name: Verify NVIDIA driver
  ansible.builtin.command: nvidia-smi --query-gpu=driver_version --format=csv,noheader
  changed_when: false
  register: nvidia_driver_version_output

- name: Require pinned NVIDIA driver version
  ansible.builtin.assert:
    that:
      - nvidia_driver_version_output.stdout_lines | unique == [nvidia_driver_package_version | regex_replace('-[0-9]+\\.amzn2023$', '')]

- name: Verify the container runtime shim
  ansible.builtin.stat:
    path: /usr/bin/nvidia-container-runtime
  register: nvidia_container_runtime_binary

- name: Require the container runtime shim
  ansible.builtin.assert:
    that:
      - nvidia_container_runtime_binary.stat.exists
    fail_msg: >-
      /usr/bin/nvidia-container-runtime is missing. A node built from this AMI would run the device
      plugin without NVML and advertise no GPUs.
