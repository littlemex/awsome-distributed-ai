#
# This template serves every GPU family from one NicLayout mapping, and the mapping holds an
# invariant: every network card other than card 0 carries EFA, and all of them use the same device
# index. A family that breaks it -- EFA on some middle cards only, or mixed device indices -- needs
# its own template rather than a fourth axis here.
#
# The NetworkInterfaces list is generated by tests/render-nic-block.py and checked by
# tests/lint-templates.sh. Do not edit it by hand.
#
# The device plugins are installed by CodeBuild because neither of them is available as an EKS
# add-on. Keep every step of the build inside the phase where the CloudFormation response handler
# is armed; a step that runs before it leaves CloudFormation waiting with no answer.

AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  EFA-enabled GPU managed node group for an existing Amazon EKS cluster, in a cluster placement
  group, optionally against a targeted On-Demand Capacity Reservation or a Capacity Block, with
  the NVIDIA and EFA Kubernetes device plugins installed and verified on every node.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Existing cluster
        Parameters:
          - ClusterName
          - KubernetesVersion
          - PrivateSubnetId
          - NodeSecurityGroupId
          - ClusterSecurityGroupId
          - NodeRoleArn
      - Label:
          default: GPU capacity
        Parameters:
          - NodeGroupName
          - GpuInstanceType
          - NodeAmiId
          - GpuNodeCount
          - GpuRootVolumeSize
          - CapacityReservationId
          - CapacityReservationType
      - Label:
          default: Optional
        Parameters:
          - PrePullImage

Parameters:
  ClusterName:
    Type: String
    Description: Name of the existing EKS cluster the node group joins.
  KubernetesVersion:
    Type: String
    Default: "1.36"
    AllowedValues: ["1.35", "1.36"]
    Description: Version of the cluster. Selects the AMI release and the kubectl used by the bootstrap.
  PrivateSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet for the GPU nodes. Must be in the Availability Zone of the capacity reservation.
  NodeSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group that allows all traffic between its own members, which is what EFA requires.
  ClusterSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: >-
      The cluster security group of the EKS cluster (aws eks describe-cluster --name <cluster>
      --query cluster.resourcesVpcConfig.clusterSecurityGroupId). EKS does not attach it
      automatically when the launch template specifies security groups.
  NodeAmiId:
    Type: String
    Default: ""
    AllowedPattern: ^(ami-[0-9a-f]{8,17})?$
    Description: >-
      Custom node AMI. Empty uses the EKS-optimised AL2023 NVIDIA AMI for KubernetesVersion. A value
      here is how a GPU family that AMI's driver does not enumerate becomes usable: build one with
      ami/ in this repository. Setting it requires ClusterEndpoint, ClusterCertificateAuthority and
      ClusterServiceCidr, because EKS stops merging its own bootstrap user data as soon as the launch
      template names an AMI.
  ClusterEndpoint:
    Type: String
    Default: ""
    Description: >-
      API server endpoint, only needed with NodeAmiId
      (aws eks describe-cluster --name <cluster> --query cluster.endpoint).
  ClusterCertificateAuthority:
    Type: String
    Default: ""
    Description: >-
      Base64 cluster CA, only needed with NodeAmiId
      (aws eks describe-cluster --name <cluster> --query cluster.certificateAuthority.data).
  ClusterServiceCidr:
    Type: String
    Default: ""
    Description: >-
      Service IPv4 CIDR, only needed with NodeAmiId
      (aws eks describe-cluster --name <cluster> --query cluster.kubernetesNetworkConfig.serviceIpv4Cidr).
  NodeRoleArn:
    Type: String
    Default: ""
    Description: IAM role for the nodes. Empty creates one with the four managed policies a GPU node needs.
  NodeGroupName:
    Type: String
    Default: gpu
    AllowedPattern: ^[a-zA-Z0-9][a-zA-Z0-9-_]{0,62}$
    Description: >-
      Name of the managed node group. Change it to add a second GPU node group to a cluster that
      already has one; the nodes still carry label role=gpu, which is what workloads select on.
  GpuInstanceType:
    Type: String
    Default: g7e.12xlarge
    AllowedValues:
      - g7.12xlarge
      - g7.24xlarge
      - g7.48xlarge
      - g7e.12xlarge
      - g7e.24xlarge
      - g7e.48xlarge
      - g6e.12xlarge
      - g6e.48xlarge
      - g5.12xlarge
      - g4dn.8xlarge
      - p4d.24xlarge
      - p4de.24xlarge
      - p5.48xlarge
      - p5en.48xlarge
      - p6-b200.48xlarge
      - p6-b300.48xlarge
    Description: >-
      GPU instance type. The interface layout follows the NicLayout mapping. Only the types listed
      as verified in README section 3 have been launched from this template.
  GpuNodeCount:
    Type: Number
    Default: 2
    MinValue: 0
    MaxValue: 8
    Description: >-
      Number of GPU nodes (min = desired = max). 0 installs the device plugins with no GPU
      capacity, which is a cheap smoke test and not a substitute for launching a node.
  GpuRootVolumeSize:
    Type: Number
    Default: 300
    MinValue: 100
    Description: Root EBS volume size in GiB. Container images for inference are large.
  CapacityReservationId:
    Type: String
    Default: ""
    Description: >-
      Targeted On-Demand Capacity Reservation or Capacity Block for ML. Empty launches On-Demand
      and consumes an open reservation with matching attributes.
  CapacityReservationType:
    Type: String
    Default: targeted-odcr
    AllowedValues: [targeted-odcr, capacity-block]
    Description: >-
      How CapacityReservationId is consumed. capacity-block sets MarketType=capacity-block and
      omits the placement group, which a Capacity Block already provides.
  PrePullImage:
    Type: String
    Default: ""
    Description: >-
      Container image pulled onto every GPU node after the device plugins are verified. The pull is
      started and not waited for, so a slow or failing pull cannot roll back the cluster. Empty
      skips it.

Rules:
  CapacityBlockNeedsReservation:
    RuleCondition: !Equals [!Ref CapacityReservationType, capacity-block]
    Assertions:
      - Assert: !Not [!Equals [!Ref CapacityReservationId, ""]]
        AssertDescription: >-
          CapacityReservationType=capacity-block requires CapacityReservationId. Without it the
          launch template asks for capacity-block billing with no reservation to bill against.
  CustomAmiNeedsClusterDetails:
    RuleCondition: !Not [!Equals [!Ref NodeAmiId, ""]]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref ClusterEndpoint, ""]]
          - !Not [!Equals [!Ref ClusterCertificateAuthority, ""]]
          - !Not [!Equals [!Ref ClusterServiceCidr, ""]]
        AssertDescription: >-
          NodeAmiId requires ClusterEndpoint, ClusterCertificateAuthority and ClusterServiceCidr.
          A launch template that names an AMI stops EKS from merging its bootstrap user data, so the
          node has to be told how to reach the cluster.
  # Both RTX PRO families are listed. That the driver in the EKS-optimised AL2023 NVIDIA AMI does not
  # enumerate these GPUs was measured on g7.12xlarge; for g7e it is inferred from the same GPU
  # generation, because no g7e capacity was obtainable. The rule fails closed on purpose: the cost of
  # being wrong about g7e is one parameter nobody needed, and the cost of leaving it out is a cluster
  # whose GPU nodes never advertise a GPU.
  RtxProFamiliesNeedACustomAmi:
    RuleCondition: !Contains
      - [g7.12xlarge, g7.24xlarge, g7.48xlarge, g7e.12xlarge, g7e.24xlarge, g7e.48xlarge]
      - !Ref GpuInstanceType
    Assertions:
      - Assert: !Not [!Equals [!Ref NodeAmiId, ""]]
        AssertDescription: >-
          The g7 and g7e families need NodeAmiId. Their RTX PRO GPUs are not enumerated by the driver
          in the EKS-optimised AL2023 NVIDIA AMI, so a node group without a custom AMI joins,
          advertises its EFA interface and never advertises nvidia.com/gpu. Build one with ami/ in
          this repository; see docs/COMPATIBILITY.md.
  PrePullNeedsNodes:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref PrePullImage, ""]
          - !Not [!Equals [!Ref GpuNodeCount, "0"]]
        AssertDescription: PrePullImage has nowhere to run when GpuNodeCount is 0.

Mappings:
  # Cards                = NetworkInfo.MaximumNetworkCards
  # EfaInterfaces        = NetworkInfo.EfaInfo.MaximumEfaInterfaces, "0" when the type has no EFA
  # PrimaryEfa           = whether network card 0 supports EFA
  # SecondaryDeviceIndex = DeviceIndex used on cards 1..N-1
  # Verified against describe-instance-types in us-east-1 and us-west-2 on 2026-09-16.
  NicLayout:
    # g7 (RTX PRO 4500) is deliberately absent from GpuInstanceType.AllowedValues. The nodes join and
    # advertise their EFA interface, and nvidia.com/gpu never appears: the EKS AL2023 NVIDIA AMI for
    # 1.36 carries driver 580.178.04 with the proprietary module, which does not enumerate this GPU.
    # The GPU itself is fine -- the same instance shows both GPUs under driver 595.91.07 with the open
    # kernel module. Offering the type here would need a node AMI with that driver, which is not what
    # AmiType: AL2023_x86_64_NVIDIA resolves to. The layout stays as data. See docs/COMPATIBILITY.md.
    g7.12xlarge:
      Cards: "1"
      EfaInterfaces: "1"
      PrimaryEfa: "true"
      SecondaryDeviceIndex: "1"
    g7.24xlarge:
      Cards: "1"
      EfaInterfaces: "1"
      PrimaryEfa: "true"
      SecondaryDeviceIndex: "1"
    g7.48xlarge:
      Cards: "2"
      EfaInterfaces: "2"
      PrimaryEfa: "true"
      SecondaryDeviceIndex: "1"
    g7e.12xlarge:
      Cards: "1"
      EfaInterfaces: "1"
      PrimaryEfa: "true"
      SecondaryDeviceIndex: "1"
    g7e.24xlarge:
      Cards: "2"
      EfaInterfaces: "2"
      PrimaryEfa: "true"
      SecondaryDeviceIndex: "1"
    g7e.48xlarge:
      Cards: "4"
      EfaInterfaces: "4"
      PrimaryEfa: "true"
      SecondaryDeviceIndex: "1"
    g6e.12xlarge:
      Cards: "1"
      EfaInterfaces: "1"
      PrimaryEfa: "true"
      SecondaryDeviceIndex: "1"
    g6e.48xlarge:
      Cards: "4"
      EfaInterfaces: "4"
      PrimaryEfa: "true"
      SecondaryDeviceIndex: "1"
    g5.12xlarge:
      Cards: "1"
      EfaInterfaces: "1"
      PrimaryEfa: "true"
      SecondaryDeviceIndex: "1"
    g4dn.8xlarge:
      Cards: "1"
      EfaInterfaces: "1"
      PrimaryEfa: "true"
      SecondaryDeviceIndex: "1"
    p4d.24xlarge:
      Cards: "4"
      EfaInterfaces: "4"
      PrimaryEfa: "true"
      SecondaryDeviceIndex: "1"
    p4de.24xlarge:
      Cards: "4"
      EfaInterfaces: "4"
      PrimaryEfa: "true"
      SecondaryDeviceIndex: "1"
    p5.48xlarge:
      Cards: "32"
      EfaInterfaces: "32"
      PrimaryEfa: "true"
      SecondaryDeviceIndex: "1"
    p5en.48xlarge:
      Cards: "16"
      EfaInterfaces: "16"
      PrimaryEfa: "true"
      SecondaryDeviceIndex: "1"
    p6-b200.48xlarge:
      Cards: "8"
      EfaInterfaces: "8"
      PrimaryEfa: "true"
      SecondaryDeviceIndex: "1"
    # 17 cards but 16 EFA interfaces: card 0 is ENA-only. The EFA interfaces sit on cards 1-16
    # with device index 0, matching architectures/aws-pcs/assets/add-cng-p6-b300.yaml, which was
    # run on B300 hardware. run-instances --dry-run accepts either device index and is blind to
    # per-card EFA capability, so the verified template decides this and not the dry run.
    p6-b300.48xlarge:
      Cards: "17"
      EfaInterfaces: "16"
      PrimaryEfa: "false"
      SecondaryDeviceIndex: "0"

  # GPUs per instance type (GpuInfo.Gpus[].Count), used by the bootstrap to assert the exact
  # allocatable count instead of "not zero". Kept separate from NicLayout so that mapping stays
  # the single description of the interface schema. A new instance type needs an entry in both.
  GpuCount:
    g7.12xlarge: { Gpus: "2" }
    g7.24xlarge: { Gpus: "4" }
    g7.48xlarge: { Gpus: "8" }
    g7e.12xlarge: { Gpus: "2" }
    g7e.24xlarge: { Gpus: "4" }
    g7e.48xlarge: { Gpus: "8" }
    g6e.12xlarge: { Gpus: "4" }
    g6e.48xlarge: { Gpus: "8" }
    g5.12xlarge: { Gpus: "4" }
    g4dn.8xlarge: { Gpus: "1" }
    p4d.24xlarge: { Gpus: "8" }
    p4de.24xlarge: { Gpus: "8" }
    p5.48xlarge: { Gpus: "8" }
    p5en.48xlarge: { Gpus: "8" }
    p6-b200.48xlarge: { Gpus: "8" }
    p6-b300.48xlarge: { Gpus: "8" }

  # Everything the bootstrap installs, in one place. These values are both handed to the build and
  # listed as properties of the custom resource, so changing a pin re-runs the install instead of
  # leaving a cluster with the old chart and a template that claims the new one.
  Versions:
    Helm:
      Version: "3.19.0"
    NvidiaDevicePluginChart:
      Version: "0.20.0"
    EfaDevicePluginChart:
      Version: "v0.5.32"

  # kubectl must stay within one minor version of the cluster.
  KubectlVersion:
    "1.35":
      Version: "1.35.8"
    "1.36":
      Version: "1.36.4"

Conditions:
  HasCustomAmi: !Not [!Equals [!Ref NodeAmiId, ""]]
  CreateNodeRole: !Equals [!Ref NodeRoleArn, ""]
  HasReservation: !Not [!Equals [!Ref CapacityReservationId, ""]]
  IsCapacityBlock: !Equals [!Ref CapacityReservationType, capacity-block]
  UsePlacementGroup: !Not [!Condition IsCapacityBlock]
  GpuZero: !Equals [!Ref GpuNodeCount, "0"]
  PrimarySupportsEfa: !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, PrimaryEfa], "true"]
  SecondaryDeviceIndexIsZero:
    !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, SecondaryDeviceIndex], "0"]
  # Card thresholds. Cards2Plus gates network card 1, Cards4Plus gates cards 2-3, and so on; the
  # generated NetworkInterfaces list picks the threshold that covers each card. Adding an
  # instance type with a card count that is not a threshold here means adding a condition.
  Cards2Plus: !Not [!Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "1"]]
  Cards4Plus: !Or
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "4"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "8"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "16"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "17"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  Cards8Plus: !Or
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "8"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "16"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "17"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  Cards16Plus: !Or
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "16"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "17"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  Cards17Plus: !Or
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "17"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  Cards32: !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]

Resources:
  NodeRole:
    Type: AWS::IAM::Role
    Condition: CreateNodeRole
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  # A cluster placement group puts the nodes on one spine, which is what multi-node EFA traffic
  # wants. A Capacity Block already places its capacity, so the group is omitted there. A targeted
  # ODCR does not have to belong to this group to be consumed from inside it.
  GpuPlacementGroup:
    Type: AWS::EC2::PlacementGroup
    Condition: UsePlacementGroup
    Properties:
      Strategy: cluster

  GpuLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${AWS::StackName}-gpu"
      LaunchTemplateData:
        InstanceType: !Ref GpuInstanceType
        ImageId: !If [HasCustomAmi, !Ref NodeAmiId, !Ref AWS::NoValue]
        Placement: !If
          - UsePlacementGroup
          - GroupName: !Ref GpuPlacementGroup
          - !Ref AWS::NoValue
        InstanceMarketOptions: !If
          - IsCapacityBlock
          - MarketType: capacity-block
          - !Ref AWS::NoValue
        CapacityReservationSpecification: !If
          - HasReservation
          - CapacityReservationTarget:
              CapacityReservationId: !Ref CapacityReservationId
          - !Ref AWS::NoValue
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: !Ref GpuRootVolumeSize
              VolumeType: gp3
              DeleteOnTermination: true
              Encrypted: true
        MetadataOptions:
          HttpPutResponseHopLimit: 2
          HttpTokens: required
        # A managed node group takes its subnets from the node group configuration, so the
        # interfaces below must not carry SubnetId. Both security groups are attached here
        # because EKS stops attaching the cluster security group as soon as the launch template
        # specifies any.
        NetworkInterfaces:
          # BEGIN GENERATED by tests/render-nic-block.py -- do not edit by hand
          # Network card 0 is the primary interface. It is an EFA interface on every
          # supported type except p6-b300, where card 0 is ENA-only.
          - DeviceIndex: 0
            NetworkCardIndex: 0
            InterfaceType: !If [PrimarySupportsEfa, efa, !Ref 'AWS::NoValue']
            Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
          - !If
            - Cards2Plus
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 1
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards4Plus
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 2
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards4Plus
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 3
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards8Plus
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 4
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards8Plus
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 5
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards8Plus
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 6
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards8Plus
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 7
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards16Plus
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 8
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards16Plus
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 9
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards16Plus
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 10
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards16Plus
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 11
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards16Plus
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 12
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards16Plus
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 13
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards16Plus
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 14
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards16Plus
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 15
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards17Plus
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 16
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards32
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 17
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards32
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 18
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards32
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 19
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards32
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 20
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards32
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 21
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards32
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 22
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards32
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 23
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards32
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 24
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards32
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 25
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards32
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 26
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards32
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 27
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards32
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 28
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards32
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 29
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards32
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 30
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          - !If
            - Cards32
            - DeviceIndex: !If [SecondaryDeviceIndexIsZero, 0, 1]
              NetworkCardIndex: 31
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroupId, !Ref ClusterSecurityGroupId]
            - !Ref 'AWS::NoValue'
          # END GENERATED
        # Assemble the local NVMe drives as one RAID0 volume, which nodeadm mounts under
        # /mnt/k8s-disks/0 and containerd uses for image layers. The inference examples in
        # examples/inference read model weights from that path.
        # Without a custom AMI, EKS merges its own bootstrap user data with this, so only the local
        # storage stanza is needed. With one, nothing is merged: the cluster block, the labels and
        # the taint have to be here, or the node never joins and pods land on it before the node
        # group's own taint is applied.
        UserData: !If
          - HasCustomAmi
          - Fn::Base64: !Sub |
              MIME-Version: 1.0
              Content-Type: multipart/mixed; boundary="==BOUNDARY=="

              --==BOUNDARY==
              Content-Type: application/node.eks.aws

              apiVersion: node.eks.aws/v1alpha1
              kind: NodeConfig
              spec:
                cluster:
                  name: ${ClusterName}
                  apiServerEndpoint: ${ClusterEndpoint}
                  certificateAuthority: ${ClusterCertificateAuthority}
                  cidr: ${ClusterServiceCidr}
                instance:
                  localStorage:
                    strategy: RAID0
                # nodeadm writes containerd's configuration at boot, so the NVIDIA runtime is
                # registered here rather than in the image: a container without it gets no driver
                # libraries and the device plugin fails with NVML ERROR_LIBRARY_NOT_FOUND while
                # nvidia-smi works on the host.
                containerd:
                  config: |
                    [plugins.'io.containerd.cri.v1.runtime'.containerd]
                    default_runtime_name = 'nvidia'
                    [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.nvidia]
                    runtime_type = 'io.containerd.runc.v2'
                    [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.nvidia.options]
                    BinaryName = '/usr/bin/nvidia-container-runtime'
                    SystemdCgroup = true
                kubelet:
                  flags:
                    - --node-labels=role=gpu,eks.amazonaws.com/nodegroup=${NodeGroupName}
                    - --register-with-taints=nvidia.com/gpu=true:NoSchedule
              --==BOUNDARY==--
          - Fn::Base64: |
              MIME-Version: 1.0
              Content-Type: multipart/mixed; boundary="==BOUNDARY=="

              --==BOUNDARY==
              Content-Type: application/node.eks.aws

              apiVersion: node.eks.aws/v1alpha1
              kind: NodeConfig
              spec:
                instance:
                  localStorage:
                    strategy: RAID0
              --==BOUNDARY==--
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "${AWS::StackName}-gpu"

  GpuNodeGroup:
    Type: AWS::EKS::Nodegroup
    Properties:
      ClusterName: !Ref ClusterName
      NodegroupName: !Ref NodeGroupName
      NodeRole: !If [CreateNodeRole, !GetAtt NodeRole.Arn, !Ref NodeRoleArn]
      AmiType: !If [HasCustomAmi, CUSTOM, AL2023_x86_64_NVIDIA]
      Subnets:
        - !Ref PrivateSubnetId
      LaunchTemplate:
        Id: !Ref GpuLaunchTemplate
        Version: !GetAtt GpuLaunchTemplate.LatestVersionNumber
      # A managed node group rejects MaxSize 0, so GpuNodeCount 0 asks for 0 desired out of a
      # maximum of 1.
      ScalingConfig:
        MinSize: !Ref GpuNodeCount
        DesiredSize: !Ref GpuNodeCount
        MaxSize: !If [GpuZero, 1, !Ref GpuNodeCount]
      Labels:
        role: gpu
      # The disaggregated-inference manifests in examples/inference already tolerate this taint
      # and the EFA resource; changing the key here would break them.
      Taints:
        - Key: nvidia.com/gpu
          Value: "true"
          Effect: NO_SCHEDULE

  BootstrapLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${AWS::StackName}-bootstrap"
      RetentionInDays: 30

  BootstrapBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: bootstrap
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - eks:DescribeCluster
                  - eks:DescribeNodegroup
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                # AWS::Logs::LogGroup's Arn already ends in ":*", so it is not the prefix to append
                # a stream wildcard to.
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-bootstrap:*"

  # Cluster-admin on the target cluster. Anyone who can start this build can therefore act as
  # cluster-admin; docs/OPERATIONS.md says so under IAM.
  BootstrapAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref ClusterName
      PrincipalArn: !GetAtt BootstrapBuildRole.Arn
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope:
            Type: cluster

  BootstrapProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-bootstrap"
      ServiceRole: !GetAtt BootstrapBuildRole.Arn
      # Keep this below the custom resource's ServiceTimeout, so a build that runs long is stopped
      # while post_build can still answer CloudFormation.
      TimeoutInMinutes: 40
      Artifacts:
        Type: NO_ARTIFACTS
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BootstrapLogGroup
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: CLUSTER_NAME
            Value: !Ref ClusterName
          - Name: NODE_GROUP_NAME
            Value: !Ref NodeGroupName
          - Name: GPU_NODE_COUNT
            Value: !Ref GpuNodeCount
          - Name: GPU_PER_NODE
            Value: !FindInMap [GpuCount, !Ref GpuInstanceType, Gpus]
          - Name: EFA_PER_NODE
            Value: !FindInMap [NicLayout, !Ref GpuInstanceType, EfaInterfaces]
          - Name: KUBECTL_VERSION
            Value: !FindInMap [KubectlVersion, !Ref KubernetesVersion, Version]
          - Name: HELM_VERSION
            Value: !FindInMap [Versions, Helm, Version]
          - Name: NVIDIA_DEVICE_PLUGIN_CHART_VERSION
            Value: !FindInMap [Versions, NvidiaDevicePluginChart, Version]
          - Name: EFA_DEVICE_PLUGIN_CHART_VERSION
            Value: !FindInMap [Versions, EfaDevicePluginChart, Version]
          - Name: PRE_PULL_IMAGE
            Value: !Ref PrePullImage
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - |
                  set -uo pipefail

                  # Everything, including the tool downloads, runs after the trap is armed, so
                  # every failure path can still answer CloudFormation.
                  STAGE="starting"
                  RESPONDED=/tmp/responded
                  send() { # $1 = SUCCESS|FAILED, $2 = reason
                    [ -n "${CFN_RESPONSE_URL:-}" ] || return 0
                    [ -f "$RESPONDED" ] && return 0
                    python3 - "$1" "$2" <<'PY' > /tmp/resp.json
                  import json, os, sys
                  print(json.dumps({
                      "Status": sys.argv[1],
                      "Reason": sys.argv[2][:1000],
                      "PhysicalResourceId": os.environ["CFN_PHYSICAL_ID"],
                      "StackId": os.environ["CFN_STACK_ID"],
                      "RequestId": os.environ["CFN_REQUEST_ID"],
                      "LogicalResourceId": os.environ["CFN_LOGICAL_ID"],
                      "Data": {"BuildId": os.environ.get("CODEBUILD_BUILD_ID", "")},
                  }))
                  PY
                    curl -fsS -X PUT -H 'Content-Type:' --data-binary @/tmp/resp.json "${CFN_RESPONSE_URL}"
                    touch "$RESPONDED"
                  }
                  fail() { send FAILED "$STAGE failed: $1 (see CodeBuild log $CODEBUILD_BUILD_ID)"; exit 1; }
                  trap 'fail "unexpected error"' ERR

                  STAGE="tool install"
                  curl -fsSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/v$KUBECTL_VERSION/bin/linux/amd64/kubectl" || fail "kubectl download"
                  chmod +x /usr/local/bin/kubectl
                  curl -fsSL "https://get.helm.sh/helm-v$HELM_VERSION-linux-amd64.tar.gz" | tar -xz -C /tmp || fail "helm download"
                  mv /tmp/linux-amd64/helm /usr/local/bin/helm
                  aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION" || fail "update-kubeconfig"

                  STAGE="device plugin install"
                  helm repo add nvdp https://nvidia.github.io/k8s-device-plugin
                  helm repo add eks https://aws.github.io/eks-charts
                  helm repo update
                  helm upgrade --install nvdp nvdp/nvidia-device-plugin \
                    --version "$NVIDIA_DEVICE_PLUGIN_CHART_VERSION" \
                    --namespace nvidia-device-plugin --create-namespace --wait --timeout 5m \
                    --set gfd.enabled=true \
                    --set-json 'tolerations=[{"key":"nvidia.com/gpu","operator":"Exists","effect":"NoSchedule"}]'
                  helm upgrade --install aws-efa-k8s-device-plugin eks/aws-efa-k8s-device-plugin \
                    --version "$EFA_DEVICE_PLUGIN_CHART_VERSION" \
                    --namespace kube-system --wait --timeout 5m \
                    --set-json 'tolerations=[{"key":"nvidia.com/gpu","operator":"Exists","effect":"NoSchedule"}]'

                  # Installation and verification are separate stages so the two failures are
                  # distinguishable.
                  STAGE="node capability check"
                  if [ "$GPU_NODE_COUNT" -eq 0 ]; then
                    send SUCCESS "device plugins installed; GpuNodeCount is 0 so no node was checked"
                    exit 0
                  fi
                  # Exact counts, not "non-zero": a node advertising 1 of 2 GPUs is a failure, and
                  # a run with no nodes cannot pass by comparing 0 against 0.
                  for attempt in $(seq 1 60); do
                    ready=$(kubectl get nodes -l "eks.amazonaws.com/nodegroup=$NODE_GROUP_NAME" -o json | python3 -c '
                  import json, os, sys
                  want_gpu = os.environ["GPU_PER_NODE"]
                  want_efa = os.environ["EFA_PER_NODE"]
                  nodes = json.load(sys.stdin)["items"]
                  ok = 0
                  print_total = len(nodes)
                  for n in nodes:
                      ready = any(c["type"] == "Ready" and c["status"] == "True"
                                  for c in n["status"].get("conditions", []))
                      if not ready:
                          continue
                      alloc = n["status"].get("allocatable", {})
                      if alloc.get("nvidia.com/gpu") != want_gpu:
                          continue
                      if want_efa != "0" and alloc.get("vpc.amazonaws.com/efa") != want_efa:
                          continue
                      ok += 1
                  print(f"{ok} {print_total}")
                  ')
                    total=${ready#* }
                    ready=${ready%% *}
                    echo "[$attempt/60] node group $NODE_GROUP_NAME: $ready of $total node(s) Ready and advertising ${GPU_PER_NODE} GPU, ${EFA_PER_NODE} EFA; want $GPU_NODE_COUNT"
                    [ "$ready" -eq "$GPU_NODE_COUNT" ] && [ "$total" -eq "$GPU_NODE_COUNT" ] && break
                    sleep 20
                  done
                  kubectl get nodes -l "eks.amazonaws.com/nodegroup=$NODE_GROUP_NAME" -o custom-columns='NAME:.metadata.name,TYPE:.metadata.labels.node\.kubernetes\.io/instance-type,GPU:.status.allocatable.nvidia\.com/gpu,EFA:.status.allocatable.vpc\.amazonaws\.com/efa'
                  [ "$ready" -eq "$GPU_NODE_COUNT" ] && [ "$total" -eq "$GPU_NODE_COUNT" ] || fail "node group $NODE_GROUP_NAME has $total node(s) of which $ready are Ready and advertise ${GPU_PER_NODE} nvidia.com/gpu and ${EFA_PER_NODE} vpc.amazonaws.com/efa; wanted $GPU_NODE_COUNT of each"

                  # The stack is complete once the nodes are capable, so the answer goes out
                  # before the pre-pull is touched at all: neither the apply nor the pull can roll
                  # back a cluster. docs/OPERATIONS.md says how to watch it.
                  send SUCCESS "$ready node(s) are Ready and advertise ${GPU_PER_NODE} nvidia.com/gpu and ${EFA_PER_NODE} vpc.amazonaws.com/efa"

                  STAGE="image pre-pull"
                  trap - ERR
                  if [ -n "$PRE_PULL_IMAGE" ]; then
                    if cat <<EOF | kubectl apply -f -
                  apiVersion: apps/v1
                  kind: DaemonSet
                  metadata: { name: prepull, namespace: kube-system }
                  spec:
                    selector: { matchLabels: { app: prepull } }
                    template:
                      metadata: { labels: { app: prepull } }
                      spec:
                        nodeSelector: { role: gpu }
                        tolerations: [{ key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }]
                        initContainers:
                          - { name: pull, image: "$PRE_PULL_IMAGE", command: ["true"] }
                        containers:
                          - { name: hold, image: public.ecr.aws/docker/library/busybox:1.36, command: ["sleep", "infinity"] }
                  EOF
                    then
                      echo "pre-pull of $PRE_PULL_IMAGE started as daemonset/prepull in kube-system"
                    else
                      echo "[WARNING] could not start the pre-pull daemonset; the cluster is complete and the image is not cached"
                    fi
                  fi
            post_build:
              commands:
                # Reached on a failed build as well, so a failure the trap did not catch still
                # answers CloudFormation. send() is a no-op once a response has been sent.
                - |
                  : "${CFN_PHYSICAL_ID:=${CFN_LOGICAL_ID:-Bootstrap}}"
                  if [ ! -f /tmp/responded ] && [ -n "${CFN_RESPONSE_URL:-}" ]; then
                    python3 - "bootstrap ended without a result; see CodeBuild log ${CODEBUILD_BUILD_ID}" <<'PY' > /tmp/resp.json
                  import json, os, sys
                  print(json.dumps({
                      "Status": "FAILED",
                      "Reason": sys.argv[1][:1000],
                      "PhysicalResourceId": os.environ["CFN_PHYSICAL_ID"],
                      "StackId": os.environ["CFN_STACK_ID"],
                      "RequestId": os.environ["CFN_REQUEST_ID"],
                      "LogicalResourceId": os.environ["CFN_LOGICAL_ID"],
                      "Data": {},
                  }))
                  PY
                    curl -fsS -X PUT -H 'Content-Type:' --data-binary @/tmp/resp.json "${CFN_RESPONSE_URL}"
                  fi

  BootstrapTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: start-build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codebuild:StartBuild
                Resource: !GetAtt BootstrapProject.Arn

  # Starts the build and hands it the response URL. The build answers CloudFormation directly,
  # which is what keeps the work off Lambda's 15-minute limit. This function only answers when
  # it fails to start the build, or on delete.
  BootstrapTrigger:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt BootstrapTriggerRole.Arn
      Code:
        ZipFile: |
          import json, urllib.request, boto3

          def respond(event, status, reason):
              body = json.dumps({
                  "Status": status,
                  "Reason": reason[:1000],
                  "PhysicalResourceId": event.get("PhysicalResourceId") or event["LogicalResourceId"],
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": {},
              }).encode()
              req = urllib.request.Request(event["ResponseURL"], data=body, method="PUT",
                                           headers={"Content-Type": ""})
              urllib.request.urlopen(req)

          def handler(event, context):
              physical = event.get("PhysicalResourceId") or event["LogicalResourceId"]
              if event["RequestType"] == "Delete":
                  respond(event, "SUCCESS", "nothing to delete; the cluster carries the releases")
                  return
              try:
                  boto3.client("codebuild").start_build(
                      projectName=event["ResourceProperties"]["ProjectName"],
                      environmentVariablesOverride=[
                          {"name": "CFN_RESPONSE_URL", "value": event["ResponseURL"]},
                          {"name": "CFN_STACK_ID", "value": event["StackId"]},
                          {"name": "CFN_REQUEST_ID", "value": event["RequestId"]},
                          {"name": "CFN_LOGICAL_ID", "value": event["LogicalResourceId"]},
                          {"name": "CFN_PHYSICAL_ID", "value": physical},
                      ])
              except Exception as exc:
                  respond(event, "FAILED", f"could not start the bootstrap build: {exc}")

  Bootstrap:
    Type: Custom::EksBootstrap
    DependsOn:
      - GpuNodeGroup
      - BootstrapAccessEntry
    Properties:
      ServiceToken: !GetAtt BootstrapTrigger.Arn
      # Bounds how long CloudFormation waits for the build. Without it the wait is an hour, and
      # a build that dies without answering bills GPU capacity for that hour.
      ServiceTimeout: 2700
      ProjectName: !Ref BootstrapProject
      # A custom resource only re-runs when one of its properties changes, so every version the
      # build installs is listed here rather than left inside the buildspec: raising a pin then
      # re-runs the install by itself. BootstrapRevision covers a change to the build's logic that
      # no version reflects; bump it in the same commit.
      BootstrapRevision: "1"
      KubernetesVersion: !Ref KubernetesVersion
      KubectlVersion: !FindInMap [KubectlVersion, !Ref KubernetesVersion, Version]
      HelmVersion: !FindInMap [Versions, Helm, Version]
      NvidiaDevicePluginChartVersion: !FindInMap [Versions, NvidiaDevicePluginChart, Version]
      EfaDevicePluginChartVersion: !FindInMap [Versions, EfaDevicePluginChart, Version]
      NodeGroupName: !Ref NodeGroupName
      GpuInstanceType: !Ref GpuInstanceType
      GpuNodeCount: !Ref GpuNodeCount
      PrePullImage: !Ref PrePullImage

Outputs:
  GpuNodeGroupName:
    Description: Name of the GPU managed node group.
    Value: !Ref NodeGroupName
  GpuInstanceType:
    Description: Instance type of the GPU nodes.
    Value: !Ref GpuInstanceType
  GpuNodeCount:
    Description: Number of GPU nodes.
    Value: !Ref GpuNodeCount
  BootstrapLogGroup:
    Description: CloudWatch log group holding the device plugin install and verification output.
    Value: !Ref BootstrapLogGroup
  BootstrapProjectName:
    Description: CodeBuild project that installs and verifies the device plugins.
    Value: !Ref BootstrapProject
  BootstrapBuildId:
    Description: Id of the build that installed and verified the device plugins.
    Value: !GetAtt Bootstrap.BuildId
