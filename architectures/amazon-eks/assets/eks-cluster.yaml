#
# The cluster and the nodes that carry cluster services, with no GPU-specific resources: GPU
# capacity is added by eks-add-gpu-nodegroup.yaml, which can be deployed against this cluster
# more than once and replaced without touching the cluster.

AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Amazon EKS cluster with API authentication, the EKS-native add-ons, and a system managed node
  group for CoreDNS and other cluster services. Takes its network from
  eks-cluster-prerequisites.yaml and adds no GPU capacity.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Cluster
        Parameters:
          - ClusterName
          - KubernetesVersion
          - AdminRoleArn
      - Label:
          default: Network (outputs of eks-cluster-prerequisites.yaml)
        Parameters:
          - PrivateSubnetId
          - ControlPlaneSubnetId
          - NodeSecurityGroupId
      - Label:
          default: System nodes
        Parameters:
          - SystemInstanceType
          - SystemNodeCount
      - Label:
          default: Shared storage for model weights (optional)
        Parameters:
          - FsxFileSystemId

Parameters:
  ClusterName:
    Type: String
    Description: Name of the EKS cluster to create.
    AllowedPattern: ^[a-zA-Z][a-zA-Z0-9-_]{0,99}$
  KubernetesVersion:
    Type: String
    Default: "1.36"
    AllowedValues: ["1.35", "1.36"]
    Description: >-
      Kubernetes version. Only versions this architecture has been deployed on are offered; see
      docs/COMPATIBILITY.md.
  AdminRoleArn:
    Type: String
    Default: ""
    Description: >-
      Extra IAM role or user that receives AmazonEKSClusterAdminPolicy. The principal that creates
      the stack always has it. An event that provisions the stack with one role and hands the
      account to a participant with another needs this.
  PrivateSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet for the nodes.
  ControlPlaneSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Second private subnet, in another Availability Zone, for the control plane.
  NodeSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Node security group from the prerequisites stack.
  SystemInstanceType:
    Type: String
    Default: m6i.xlarge
    Description: Instance type of the system node group.
  SystemNodeCount:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 4
    Description: >-
      Number of system nodes. Two by default so CoreDNS has two replicas on separate nodes, and
      so the node-feature-discovery master the NVIDIA chart deploys has somewhere to run that is
      not a tainted GPU node.
  FsxFileSystemId:
    Type: String
    Default: ""
    Description: >-
      FSx for Lustre filesystem id from the prerequisites stack. A non-empty value installs the
      aws-fsx-csi-driver add-on. The PersistentVolume that binds to the filesystem is a Kubernetes
      object and is not created here; docs/OPERATIONS.md carries the manifest.

Conditions:
  HasAdmin: !Not [!Equals [!Ref AdminRoleArn, ""]]
  WithFsx: !Not [!Equals [!Ref FsxFileSystemId, ""]]

Resources:
  ClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  Cluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt ClusterRole.Arn
      AccessConfig:
        AuthenticationMode: API
        BootstrapClusterCreatorAdminPermissions: true
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref PrivateSubnetId
          - !Ref ControlPlaneSubnetId
        SecurityGroupIds:
          - !Ref NodeSecurityGroupId
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
      Logging:
        ClusterLogging:
          EnabledTypes:
            - Type: api
            - Type: audit

  AdminAccessEntry:
    Type: AWS::EKS::AccessEntry
    Condition: HasAdmin
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !Ref AdminRoleArn
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope:
            Type: cluster

  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  # Add-on versions are left at the default for the cluster version, which is what EKS supports
  # for that version. docs/COMPATIBILITY.md records the versions a deploy resolved to.
  VpcCniAddon:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref Cluster
      AddonName: vpc-cni
      ResolveConflicts: OVERWRITE
  KubeProxyAddon:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref Cluster
      AddonName: kube-proxy
      ResolveConflicts: OVERWRITE
  PodIdentityAddon:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref Cluster
      AddonName: eks-pod-identity-agent
      ResolveConflicts: OVERWRITE
  # CoreDNS runs on nodes, so it waits for the system node group; otherwise the add-on reports
  # degraded until nodes appear.
  CoreDnsAddon:
    Type: AWS::EKS::Addon
    DependsOn: SystemNodeGroup
    Properties:
      ClusterName: !Ref Cluster
      AddonName: coredns
      ResolveConflicts: OVERWRITE
  FsxCsiAddon:
    Type: AWS::EKS::Addon
    Condition: WithFsx
    DependsOn: SystemNodeGroup
    Properties:
      ClusterName: !Ref Cluster
      AddonName: aws-fsx-csi-driver
      ResolveConflicts: OVERWRITE

  SystemNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn:
      - VpcCniAddon
      - KubeProxyAddon
    Properties:
      ClusterName: !Ref Cluster
      NodegroupName: system
      NodeRole: !GetAtt NodeRole.Arn
      AmiType: AL2023_x86_64_STANDARD
      InstanceTypes:
        - !Ref SystemInstanceType
      Subnets:
        - !Ref PrivateSubnetId
      ScalingConfig:
        MinSize: !Ref SystemNodeCount
        DesiredSize: !Ref SystemNodeCount
        MaxSize: !Ref SystemNodeCount
      Labels:
        role: system

Outputs:
  ClusterName:
    Description: Name of the cluster.
    Value: !Ref Cluster
  ClusterArn:
    Description: ARN of the cluster.
    Value: !GetAtt Cluster.Arn
  ClusterSecurityGroupId:
    Description: >-
      Security group EKS created for the cluster. A launch template that sets its own security
      groups has to include this one, because EKS then stops adding it.
    Value: !GetAtt Cluster.ClusterSecurityGroupId
  NodeRoleArn:
    Description: IAM role of the nodes, reusable by a GPU node group stack.
    Value: !GetAtt NodeRole.Arn
  KubeconfigCommand:
    Description: Command that writes a kubeconfig entry for this cluster.
    Value: !Sub "aws eks update-kubeconfig --name ${Cluster} --region ${AWS::Region}"
